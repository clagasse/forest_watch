name: Pre-Assess BC Open FOM Proposals

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  preassess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run BC FOM multi-block pre-assessment
        run: npm run preassess

      - name: Commit updated pre-assessment snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet public/data/preassessed_foms.json || [ -n "$(git status --porcelain public/data/preassessed_foms.json)" ]; then
            git add public/data/preassessed_foms.json
            git commit -m "chore: update pre-assessed BC FOM snapshot"
            git push
          else
            echo "No changes to public/data/preassessed_foms.json"
          fi
